services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duo_lol
      POSTGRES_PASSWORD: duo_lol123
      POSTGRES_DB: duo_lol
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duo_lol -d duo_lol']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
